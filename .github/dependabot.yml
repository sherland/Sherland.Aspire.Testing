version: 2
updates:
  # .NET packages (Sherland.Aspire.Testing.Xunit + samples)
  # No root .sln/.csproj exists, so each project directory must be listed
  # explicitly; Dependabot's nuget discovery is non-recursive from "directory".
  - package-ecosystem: "nuget"
    directories:
      - "/source/Sherland.Aspire.Testing.Xunit"
      - "/samples/Sherland.Aspire.AppHost"
      - "/samples/Sherland.Aspire.DemoApi"
      - "/samples/Sherland.Aspire.DemoTests"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  # React sample UI
  - package-ecosystem: "npm"
    directory: "/samples/Sherland.Aspire.Demo.Ui.React"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  # GitHub Actions used in CI workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
