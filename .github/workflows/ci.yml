name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: samples/Sherland.Aspire.Demo.Ui.React/package-lock.json

      - name: Install demo UI dependencies
        working-directory: samples/Sherland.Aspire.Demo.Ui.React
        run: npm ci

      - name: Build tests
        run: dotnet build samples/Sherland.Aspire.DemoTests/Sherland.Aspire.DemoTests.csproj -c Debug

      - name: Install Playwright browser/dependencies
        run: pwsh scripts/Install-PlaywrightDependencies.ps1

      - name: Run tests
        run: dotnet test samples/Sherland.Aspire.DemoTests/Sherland.Aspire.DemoTests.csproj -c Debug -v minimal --no-build

      - name: Resolve MinVer pre-release override
        id: minver
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:MinVerVersionOverride=0.0.0-alpha-$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack Sherland.Aspire.Testing.Xunit
        run: dotnet pack source/Sherland.Aspire.Testing.Xunit/Sherland.Aspire.Testing.Xunit.csproj -c Release -o artifacts/nuget ${{ steps.minver.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*.*nupkg

      - name: Push Sherland.Aspire.Testing.Xunit to GitHub Packages
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/sherland/index.json --skip-duplicate
